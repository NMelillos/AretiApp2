services:
  - type: web
    name: aretiapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      # Professional production storage:
      # Create a Supabase or Render Postgres database and set this to the connection string.
      - key: DATABASE_URL
        sync: false
