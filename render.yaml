services:
  - type: web
    name: aretiapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    # For production persistence, use a paid Render instance and attach a disk:
    # disk:
    #   name: aretiapp-data
    #   mountPath: /var/data
    #   sizeGB: 1
